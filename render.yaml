services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  - type: web
    name: researchs-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: FRONTEND_URL
        sync: false   # fill in after frontend is deployed
    healthCheckPath: /health

  # ── React/Vite Frontend (Static Site) ───────────────────────────────────────
  - type: web
    name: researchs-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false   # fill in with backend URL after it is deployed

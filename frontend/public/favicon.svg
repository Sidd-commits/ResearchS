<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="rs-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Ribbon Accent Gradient -->
    <linearGradient id="rs-accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Spark Gold Gradient -->
    <linearGradient id="rs-spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="rs-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#rs-bg-grad)" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Research Paper Symbol (Stylized Left & Right Pages) -->
  <path d="M14 44 V20 C14 18 16 17 24 18 C30 18.8 32 21 32 21 C32 21 34 18.8 40 18 C48 17 50 18 50 20 V44 C50 44 45 43 38 44 C33 44.8 32 47 32 47 C32 47 31 44.8 26 44 C19 43 14 44 14 44 Z"
        fill="#ffffff"
        fill-opacity="0.12"
        stroke="#ffffff"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Center Spine Divider -->
  <line x1="32" y1="21" x2="32" y2="47" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.4" stroke-linecap="round" />

  <!-- Academic Text Lines Left Page -->
  <line x1="19" y1="26" x2="27" y2="26.5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.75" />
  <line x1="19" y1="31" x2="27" y2="31.5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.75" />
  <line x1="19" y1="36" x2="25" y2="36.5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.75" />

  <!-- Academic Text Lines Right Page -->
  <line x1="37" y1="26.5" x2="45" y2="26" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.75" />
  <line x1="37" y1="31.5" x2="45" y2="31" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.75" />
  <line x1="37" y1="36.5" x2="43" y2="36" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.75" />

  <!-- AI Neural Spark Star (Top Right) -->
  <path d="M48 14 C48 10 50 8 54 8 C50 8 48 6 48 2 C48 6 46 8 42 8 C46 8 48 10 48 14 Z"
        fill="url(#rs-spark-grad)"
        filter="url(#rs-glow)" />

  <!-- Small AI Micro-Spark (Bottom Left) -->
  <circle cx="16" cy="14" r="1.5" fill="#38bdf8" />
  <circle cx="20" cy="11" r="0.8" fill="#c084fc" />
</svg>